services:
  - type: web
    name: campusconnect-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusconnect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BASE_URL
        value: https://campusconnect.onrender.com

databases:
  - name: campusconnect-db
    databaseName: campusconnect
    user: campusadmin
    plan: free
